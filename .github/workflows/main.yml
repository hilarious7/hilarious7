name: Update Profile README

on:
  schedule:
    - cron: "0 */12 * * *" # Bot berjalan otomatis setiap 12 jam
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update Activity and Animation
    steps:
      - uses: actions/checkout@v3
      
      # Menarik aktivitas terbaru (Pull Request/Commits)
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Membuat animasi kontribusi
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      # Mengirim hasil animasi ke branch "output" agar bisa dipanggil HTML
      - name: Push animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
